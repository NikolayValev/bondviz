[build-system]
requires = ["setuptools>=69", "wheel", "pybind11>=2.12.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bondviz"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
  "pandas>=2.2.2",
  "pandas-datareader>=0.10.0",
  "python-dotenv>=1.0.1",
  "matplotlib>=3.9.0",
  "streamlit>=1.38.0"
  , "polygon-api-client>=1.13.0"
  , "scikit-learn>=1.3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0", "mypy>=1.11.0"]
etl = [
  "SQLAlchemy>=2.0.30",
  "psycopg[binary]>=3.1.18",
  "alembic>=1.13.0",
  "pydantic-settings>=2.3.0",
  "tenacity>=8.3.0",
]
api = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pre-existing dynamic/optional-import patterns in the legacy Streamlit app,
# out of scope for the data-layer work this config was added for.
module = ["bondviz.pricing", "bondviz.theme"]
ignore_errors = true
